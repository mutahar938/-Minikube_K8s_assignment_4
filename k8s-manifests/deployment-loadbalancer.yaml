apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-lb-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-lb
  template:
    metadata:
      labels:
        app: app-lb
    spec:
      containers:
      - name: pod-info-container
        image: custom-pod-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: service-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: app-lb
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 5000