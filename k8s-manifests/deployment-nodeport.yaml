apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-nodeport-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-nodeport
  template:
    metadata:
      labels:
        app: app-nodeport
    spec:
      containers:
      - name: pod-info-container
        image: custom-pod-app:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: service-nodeport
spec:
  type: NodePort
  selector:
    app: app-nodeport
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
    nodePort: 30080